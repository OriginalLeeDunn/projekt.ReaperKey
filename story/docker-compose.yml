name: ghostkey

# Run from anywhere with: docker compose -f story/docker-compose.yml up -d
# Standalone — fully self-contained, no server/secrets required.

services:
  story:
    build: .
    container_name: ghostkey-story
    mem_limit: 512m
    cpus: "0.50"
    ports:
      - "3005:3005"
    restart: unless-stopped

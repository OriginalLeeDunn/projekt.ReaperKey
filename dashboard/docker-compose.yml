name: ghostkey

# Run from anywhere with: docker compose -f dashboard/docker-compose.yml up
# Kept separate from the root docker-compose.yml (the real server) so viewing
# the dashboard never requires the server's required secrets (JWT_SECRET,
# BASE_BUNDLER_URL, BASE_PAYMASTER_URL) to be set.

services:
  dashboard:
    build: .
    container_name: ghostkey-dashboard
    mem_limit: 768m
    cpus: "0.75"
    working_dir: /repo/dashboard
    ports:
      - "3002:3002" # frontend (React + Vite)
      - "3003:3003" # API (Express) — proxied from the frontend at /api
    volumes:
      # Bind-mounts the whole repo read-write: the dashboard watches
      # docs/agents/*.md and db/ghostkey.db live via fs.watch, so it's meant
      # to reflect the real, currently-checked-out repo state — not a copy
      # baked into the image at build time.
      - ..:/repo
      # Shadows the bind-mounted dashboard/node_modules with the one built
      # in the image (native bindings for better-sqlite3 must match the
      # container's platform, which the host's node_modules may not).
      - dashboard-node-modules:/repo/dashboard/node_modules
    environment:
      # Optional — enables the GitHub releases/PR/CI-status panels.
      # Falls back to your local `gh` auth if you export it yourself, e.g.:
      #   GITHUB_TOKEN=$(gh auth token) docker compose -f dashboard/docker-compose.yml up
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Points the "Backend/Health" panel at the real server's container
      # (name: ghostkey above matches the root docker-compose.yml's project
      # name, so both land on the same `ghostkey_default` network and can
      # reach each other by container name — no explicit network/depends_on
      # needed). 127.0.0.1 would only ever mean this container itself.
      # Harmless if `server` isn't running — the healthcheck just reports
      # down, same as today.
      - BACKEND_HOST=ghostkey-server
      - BACKEND_PORT=8080
    restart: unless-stopped

volumes:
  dashboard-node-modules:

name: ghostkey

services:
  server:
    build: .
    container_name: ghostkey-server
    ports:
      - "8080:8080"
    volumes:
      - ghostkey-data:/data
    environment:
      # Required secrets — override via .env or shell env
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - BASE_RPC_URL=${BASE_RPC_URL:-https://sepolia.base.org}
      - BASE_BUNDLER_URL=${BASE_BUNDLER_URL:?BASE_BUNDLER_URL is required}
      - BASE_PAYMASTER_URL=${BASE_PAYMASTER_URL:?BASE_PAYMASTER_URL is required}
      # Server config
      - GHOSTKEY__SERVER__CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      - GHOSTKEY__SERVER__LOG_FORMAT=json
      - GHOSTKEY__DATABASE__URL=sqlite:///data/ghostkey.db
      - GHOSTKEY__CHAINS__BASE__CHAIN_ID=${CHAIN_ID:-84532}
      - GHOSTKEY__CHAINS__BASE__ENTRY_POINT=0x0000000071727De22E5E9d8BAf0edAc6f37da032
    healthcheck:
      # No wget/curl in the runtime image (debian-slim + just
      # ca-certificates/libssl3 for the Rust binary) — bash IS present, and
      # its /dev/tcp pseudo-device can do a real HTTP GET with zero new
      # image dependencies. CMD (not CMD-SHELL): /bin/sh on Debian is dash,
      # which doesn't support /dev/tcp, so bash must be invoked directly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Reference app — needs a live server to actually do anything, so it lives
  # here (alongside `server`) rather than getting its own standalone compose
  # file the way dashboard/ and story/ do.
  example:
    build:
      context: .
      dockerfile: example/Dockerfile
    container_name: ghostkey-example
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      # This ships to the browser, not the container — "server" as a
      # hostname only resolves inside the compose network, so it has to be
      # the host-published port (8080:8080 above), not a container hostname.
      - VITE_API_URL=http://localhost:8080
    restart: unless-stopped

volumes:
  ghostkey-data:
